name: R reference equivalence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  reference:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Enforce Python, R, and Rust dependency pins
        run: python scripts/check-dependency-pins.py
      - name: Check dependency age before installing packages
        run: python scripts/check-fresh-deps.py
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.10'
          enable-cache: false
      - name: Install locked CI environment
        run: |
          uv lock --check
          uv sync --locked --group ci --no-install-project --no-build
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Verify restored R packages match renv.lock
        run: Rscript scripts/check-r-lock.R
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - run: python -m build --no-isolation
      - run: uv pip install --no-deps dist/*.whl
      - name: Test installed analysis package against pinned R
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/python" -q
        env:
          LIMPA_RS_R_PROJECT: ${{ github.workspace }}
          LIMPA_RS_INTEGRATION: '1'
      - run: cargo build --release --locked
      - run: Rscript validation/test_modules.R
      - run: Rscript validation/reference.R check
      - run: Rscript validation/end_to_end.R
        env:
          LIMPA_RS_ROOT: ${{ github.workspace }}
# Synthetic only. Private data and full-workload performance remain local checks.
