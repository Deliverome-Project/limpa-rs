name: R reference equivalence
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build pytest
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Test installed analysis package against pinned R
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/python" -q
        env:
          LIMPA_RS_R_PROJECT: ${{ github.workspace }}
          LIMPA_RS_INTEGRATION: '1'
      - run: cargo build --release --locked
      - run: Rscript validation/test_modules.R
      - run: Rscript validation/reference.R check
      - run: Rscript validation/end_to_end.R
        env:
          LIMPA_RS_ROOT: ${{ github.workspace }}
# Synthetic only. Private data and full-workload performance remain local checks.
