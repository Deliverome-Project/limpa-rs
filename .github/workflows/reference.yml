name: R reference equivalence
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: Rscript validation/test_modules.R
      - run: Rscript validation/reference.R check
      - run: Rscript validation/end_to_end.R
        env:
          LIMPA_RS_ROOT: ${{ github.workspace }}
# Synthetic only. Private data and full-workload performance remain local checks.
