name: Rust
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build pytest
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/python" -q
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ matrix.os }}
          path: dist/*
# Private-data and full R validations remain explicit local checks, not claimed here.
