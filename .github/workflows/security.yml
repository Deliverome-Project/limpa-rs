name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Enforce Python, R, and Rust dependency pins
        run: python scripts/check-dependency-pins.py
      - name: Check dependency age before installing packages
        run: python scripts/check-fresh-deps.py
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.10'
          enable-cache: false
      - name: Install locked CI environment
        run: |
          uv lock --check
          uv sync --locked --group ci --no-install-project --no-build
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Test dependency-age policy
        run: python -m unittest discover -s tests/security -v
      - name: Audit Python dependencies without installing the project
        run: |
          uv export --locked --group ci --no-emit-project --output-file "$RUNNER_TEMP/audit-requirements.txt"
          pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/audit-requirements.txt"
      - name: Audit workflow security
        run: zizmor --offline --min-severity medium .github/workflows
      - name: Install checksum-verified security scanners
        env:
          SCANNER_DIR: ${{ runner.temp }}/limpa-scanners
        run: |
          set -euo pipefail
          mkdir -p "$SCANNER_DIR"
          cd "$SCANNER_DIR"
          curl --fail --silent --show-error --location --retry 3 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          curl --fail --silent --show-error --location --retry 3 -o audit.tgz https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz
          echo '7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  audit.tgz' | sha256sum --check
          tar -xzf audit.tgz --strip-components=1
          echo "$SCANNER_DIR" >> "$GITHUB_PATH"
      - name: Scan full Git history for secrets
        run: gitleaks git --redact --no-banner --log-opts="--all" .
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
      - name: Audit Rust dependencies
        run: |
          cargo fetch --locked
          cargo-audit audit --file Cargo.lock --deny yanked --deny unsound
